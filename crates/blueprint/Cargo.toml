[package]
name = "blueprint"
description = "Blueprint: planning for shows - mic plots, setlists, patch plans and more"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
bp-core.workspace = true
bp-print.workspace = true
eframe = { version = "0.37", default-features = false, features = ["wgpu", "default_fonts", "x11", "wayland", "accesskit"] }
egui = "0.37"
image = { version = "0.25", default-features = false, features = ["png"] }
rfd = "0.15"
dirs = "6"
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
egui_kittest = { version = "0.37", features = ["eframe", "wgpu"] }
tempfile = "3"

[build-dependencies]
winresource = "0.1"

[lints]
workspace = true
