[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.2.2"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"
bp-core = { path = "crates/bp-core" }
bp-print = { path = "crates/bp-print" }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true

[profile.dev]
# Line tables are enough for backtraces; full debug info makes target/ huge.
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false

# For install-mac.sh / install.sh on your own computer: like release, but
# without link-time optimisation and with incremental builds, so a change
# rebuilds in well under a minute instead of minutes. Releases keep `release`.
[profile.local]
inherits = "release"
lto = "off"
codegen-units = 256
incremental = true
